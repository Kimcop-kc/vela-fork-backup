name: Build Windows Vela (最终版)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      - name: 显示将要构建的提交
        run: git log -1 --format="%H %s"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 npm 镜像源
        run: npm config set registry https://registry.npmmirror.com

      - name: 清理可能存在的锁文件
        run: |
          if (Test-Path "pnpm-lock.yaml") { Remove-Item -Path "pnpm-lock.yaml" -Force }
          if (Test-Path "package-lock.json") { Remove-Item -Path "package-lock.json" -Force }
          if (Test-Path "yarn.lock") { Remove-Item -Path "yarn.lock" -Force }
          if (Test-Path "node_modules") { Remove-Item -Path "node_modules" -Recurse -Force }

      - name: 使用 npm 安装依赖
        run: |
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            npm install --force --legacy-peer-deps
          }

      - name: 构建 Windows 版本
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.KK }}

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe-Final
          path: |
            release/**/*.exe
            !release/**/win-unpacked/**
          retention-days: 30

      - name: 显示构建结果
        run: Get-ChildItem -Path release -Recurse -Filter *.exe
