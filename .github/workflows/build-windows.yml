name: Build Vela (Windows + macOS)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            artifact: Vela-Windows-x64
            build_args: "-- --win --x64"
            files: |
              release/**/*.exe
              !release/**/win-unpacked/**
          - os: macos-latest
            label: macOS x64 (Intel)
            artifact: Vela-macOS-x64
            build_args: "-- --mac --x64"
            files: |
              release/**/*.dmg
          - os: macos-latest
            label: macOS arm64 (Apple Silicon)
            artifact: Vela-macOS-arm64
            build_args: "-- --mac --arm64"
            files: |
              release/**/*.dmg
    steps:
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      - name: 显示将要构建的提交
        shell: pwsh
        run: git log -1 --format="%H %s"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 npm 镜像源
        shell: pwsh
        run: npm config set registry https://registry.npmmirror.com

      - name: 清理可能存在的锁文件
        shell: pwsh
        run: |
          foreach ($f in @("pnpm-lock.yaml", "package-lock.json", "yarn.lock")) {
            if (Test-Path $f) { Remove-Item -Path $f -Force }
          }
          if (Test-Path "node_modules") { Remove-Item -Path "node_modules" -Recurse -Force }

      - name: 使用 npm 安装依赖
        shell: pwsh
        run: |
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            npm install --force --legacy-peer-deps
          }

      - name: 构建 ${{ matrix.label }}
        shell: pwsh
        run: npm run build ${{ matrix.build_args }}
        env:
          GH_TOKEN: ${{ secrets.KK }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传安装包到 Release
        continue-on-error: true
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $files = Get-ChildItem -Path release -Recurse -File | Where-Object {
            $_.Extension -in ".exe", ".dmg" -and $_.FullName -notmatch 'win-unpacked'
          }
          if (-not $files) { Write-Host "未找到安装包，跳过上传"; exit 0 }
          $exists = $true
          try { gh release view $tag *> $null } catch { $exists = $false }
          if (-not $exists) { Write-Host "Release $tag 不存在，跳过上传"; exit 0 }
          foreach ($f in $files) {
            Write-Host "上传 $($f.Name) -> $tag"
            gh release upload $tag $f.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.KK }}

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 30

      - name: 显示构建结果
        shell: pwsh
        run: Get-ChildItem -Path release -Recurse -Include *.exe, *.dmg | Select-Object FullName, Length
